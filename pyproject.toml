[project]
name = "astrology-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31.0",
    "asyncpg>=0.31.0",
    "openai>=3.21.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "requests>=2.32",
    "timezonefinder>=6.5",
    "tzdata>=2024.1",
    # pyswisseph has no wheels for Python 3.12+; pysweph exposes the same swisseph API.
    "pysweph>=2.10.3.6",
    "langfuse>=5.2.0",
]

[project.optional-dependencies]
# Local inference and FB2 tokenization for offline re-indexing. The bot runtime
# uses cloud embeddings and does not install PyTorch.
local-embeddings = [
    "sentence-transformers>=5.1.2,<6",
    "transformers>=4.41,<5",
    "torch==2.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# --- НАСТРОЙКА CUDA ДЛЯ UV ---
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
